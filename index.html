<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Energy Dashboard | Mad River Road</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            :root {
                --primary: #2563eb;
                --bg: #f8fafc;
                --card: #ffffff;
                --text: #1e293b;
            }
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; }
            .container { max-width: 1000px; margin: 0 auto; }
            .header { text-align: center; margin-bottom: 30px; }
            .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
            .full-width { grid-column: span 2; }
            h2 { margin-top: 0; font-size: 1.2rem; color: var(--primary); }
            .form-group { margin-bottom: 15px; }
            label { display: block; margin-bottom: 5px; font-weight: 600; }
            input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
            button { background-color: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
            button:hover { opacity: 0.9; }
            .metric { font-size: 2.5rem; font-weight: bold; text-align: center; margin: 10px 0; color: var(--primary); }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Thornton Energy Dashboard</h1>
                <p>101 Mad River Road Management</p>
            </div>
            <div class="grid">
                <div class="card">
                    <h2>Monthly Data Entry</h2>
                    <form id="energyForm">
                        <div class="form-group">
                            <label>Month</label>
                            <select id="monthSelect">
                                <option value="0">January</option><option value="1">February</option>
                                <option value="2">March</option><option value="3">April</option>
                                <option value="4">May</option><option value="5">June</option>
                                <option value="6">July</option><option value="7">August</option>
                                <option value="8">September</option><option value="9">October</option>
                                <option value="10">November</option><option value="11">December</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Solar Generation (kWh)</label>
                            <input type="number" id="genInput" placeholder="e.g. 450">
                        </div>
                        <div class="form-group">
                            <label>Total Consumption (kWh)</label>
                            <input type="number" id="consInput" placeholder="e.g. 400">
                        </div>
                        <button type="button" onclick="calculate()">Update Dashboard</button>
                    </form>
                </div>
                <div class="card">
                    <h2>Current Offset</h2>
                    <div id="offsetText" class="metric">0%</div>
                    <p style="text-align:center">Self-Sufficiency Status</p>
                </div>
                <div class="card full-width">
                    <h2>Solar Offset Trends (2026)</h2>
                    <canvas id="energyChart"></canvas>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
    </html>
