<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f8fafc; color: #334155; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #0f172a; margin-bottom: 20px; }
        .dashboard-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .metric-card { padding: 10px 15px; background: white; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; text-align: center; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .metric-card:hover { border-color: #3b82f6; background-color: #f1f5f9; }
        .metric-card.active { background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; padding: 15px; background: white; border-radius: 8px; border: 1px solid #e2e8f0; }
        select { padding: 8px; border-radius: 4px; border: 1px solid #cbd5e1; }
        .chart-wrapper { background: white; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 30px; height: 400px; }
        .log-section { background: white; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .log-section h3 { margin-top: 0; text-align: center; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .form-grid input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Energy Consumption Dashboard</h1>
        
        <div class="dashboard-grid">
            <div class="metric-card active" onclick="showMetric('solar_made')">Solar Made</div>
            <div class="metric-card" onclick="showMetric('elec_purchased')">Grid Purchased</div>
            <div class="metric-card" onclick="showMetric('solar_used')">Solar Used</div>
            <div class="metric-card" onclick="showMetric('solar_sold')">Solar Sold</div>
            <div class="metric-card" onclick="showMetric('kwh_paid')">kWh Paid</div>
            <div class="metric-card" onclick="showMetric('total_power')">Total Power</div>
            <div class="metric-card" onclick="showMetric('propane_usage')">Propane Usage</div>
            <div class="metric-card" onclick="showMetric('propane_cost')">Propane Cost</div>
            <div class="metric-card" onclick="showMetric('elec_bill')">Electric Bill</div>
        </div>

        <div class="controls">
            <label><strong>Compare:</strong></label>
            <select id="yearSelect1" onchange="changeYear1(this.value)"></select>
            <span><strong>vs</strong></span>
            <select id="yearSelect2" onchange="changeYear2(this.value)"></select>
        </div>

        <div class="chart-wrapper">
            <canvas id="energyChart"></canvas>
        </div>

        <div class="log-section">
            <h3>Log Monthly Data</h3>
            <div class="form-grid">
                <input type="number" id="inputYear" placeholder="Year (e.g. 2026)">
                <input type="number" id="inputMonth" placeholder="Month (1-12)">
                <input type="number" id="inputSolarMade" placeholder="Solar Made (kWh)">
                <input type="number" id="inputGridPurchased" placeholder="Grid Purchased (kWh)">
                <input type="number" id="inputSolarUsed" placeholder="Solar Used (kWh)">
                <input type="number" id="inputSolarSold" placeholder="Solar Sold (kWh)">
                <input type="number" id="inputKwhPaid" placeholder="kWh Paid (kWh)">
                <input type="number" id="inputElecBill" placeholder="Elec Bill ($)" step="0.01">
                <input type="number" id="inputPropaneUsage" placeholder="Propane Usage (Gals)" step="0.01">
                <input type="number" id="inputPropaneCost" placeholder="Propane Cost ($)" step="0.01">
                <input type="number" id="inputTotalPower" placeholder="Total Power (kWh)">
            </div>
            <button class="submit-btn" onclick="logMonthlyData()">Submit Data</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
