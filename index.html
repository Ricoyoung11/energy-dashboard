<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Energy Dashboard</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            :root {
                --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b;
                body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
                .container { max-width: 1200px; margin: 0 auto; }
                .header { text-align: center; margin-bottom: 30px; }
                .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
                .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
                .full-width { grid-column: 1 / -1; }
                .span-2 { grid-column: span 2; }
                h2 { margin-top: 0; font-size: 1.2rem; color: var(--primary); border-bottom: 1px solid var(--primary); padding-bottom: 10px; }
                h3 { margin-top: 1rem; margin-bottom: 10px; color: #475569; }
                .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
                .form-group { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; }
                input, select { width: 100%; padding: 8px; border: 1px solid var(--border, #d1d5db); border-radius: 6px; box-sizing: border-box; }
                button { background-color: var(--primary); color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
                button:hover { background-color: #1d4ed8; }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Thornton Energy Dashboard</h1>
                
            </div>
    
            <div class="grid">
                <div class="card">
                    <h2>Log Monthly Data</h2>
                    <div class="form-grid">
                        <div>
                            <label for="yearSelect" class="form-group">Year:</label>
                            <select id="yearSelect">
                                <option value="2024">2024</option><option value="2025">2025</option><option value="2026" selected>2026</option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option><option value="2030">2030</option><option value="2031">2031</option><option value="2032">2032</option><option value="2033">2033</option><option value="2034">2034</option><option value="2035">2035</option>
                            </select>
                        </div>
                        <div>
                            <label for="monthSelect" class="form-group">Month:</label>
                            <select id="monthSelect">
                                <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option><option value="3">Apr</option><option value="4">May</option><option value="5">Jun</option><option value="6">Jul</option><option value="7">Aug</option><option value="8">Sep</option><option value="9">Oct</option><option value="10">Nov</option><option value="11">Dec</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div><label for="in_solarMade" class="form-group">Solar Made (kWh):</label><input type="number" id="in_solarMade"></div>
                        <div><label for="in_elecPurchased" class="form-group">Electric Purchased (kWh):</label><input type="number" id="in_elecPurchased"></div>
                        <div><label for="in_solarUsed" class="form-group">Solar Used (kWh):</label><input type="number" id="in_solarUsed"></div>
                        <div><label for="in_solarSold" class="form-group">Solar Sold (kWh):</label><input type="number" id="in_solarSold"></div>
                        <div><label for="in_kwhPaid" class="form-group">kWh Paid For:</label><input type="number" id="in_kwhPaid"></div>
                        <div><label for="in_elecBill" class="form-group">Electric Bill ($):</label><input type="number" id="in_elecBill"></div>
                        <div><label for="in_propaneUsage" class="form-group">Propane Usage (gal):</label><input type="number" id="in_propaneUsage"></div>
                        <div><label for="in_propaneCost" class="form-group">Propane Cost ($):</label><input type="number" id="in_propaneCost"></div>
                    </div>
                    <div style="text-align: center; margin-top: 15px;">Calculated Offset: <span id="offsetText" style="font-weight: bold; font-size: 1.2rem;">0%</span></div>
                    <button onclick="logMonthlyData()" style="width: 100%; margin-top: 15px;">Log Data</button>
                </div>
    
                <div class="card span-2 full-width">
                    <h2>Energy Metrics Over Time</h2>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                            <h2 style="margin: 0; border: none;">Metric Comparison Trends</h2>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                            <select id="metricDropdown" onchange="changeChartMetric()" style="width: auto; padding: 8px; font-weight: bold;">
                                <option value="propaneUsage">Propane Usage (gallons)</option><option value="propaneCost">Total Propane Cost</option>
                                <option value="solarMade">Solar Made (kWh)</option><option value="elecPurchased">Electric Purchased</option>
                                <option value="solarUsed">Solar Used While Making (kWh)</option><option value="solarSold">Solar Sold (kWh)</option>
                                <option value="elecBill">Electric Bill</option><option value="offset" selected>Solar Offset %</option>
                                <option value="kwhPaid">kWh paid for</option><option value="totalPower">Total Power Used</option>
                            </select>
                            <select id="chartYear1Dropdown" onchange="changeChartMetric()" style="width: auto; padding: 8px; font-weight: bold;">
                                <option value="2024">2024</option><option value="2025">2025</option><option value="2026" selected>2026</option>
                                <option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option>
                                <option value="2030">2030</option><option value="2031">2031</option><option value="2032">2032</option>
                                <option value="2033">2033</option><option value="2034">2034</option><option value="2035">2035</option>
                            </select>
                            <span style="font-weight: bold; color: #64748B;"> VS </span>
                            <select id="chartYear2Dropdown" onchange="changeChartMetric()" style="width: auto; padding: 8px; font-weight: bold;">
                                <option value="historical" selected>Historical Avg</option>
                                <option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option>
                                <option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option>
                                <option value="2030">2030</option><option value="2031">2031</option><option value="2032">2032</option>
                                <option value="2033">2033</option><option value="2034">2034</option><option value="2035">2035</option>
                            </select>
                        </div>
                    </div>
                    <canvas id="energyChart" height="90"></canvas>
                </div>
    
                <div class="card">
                    <h2>Propane Tank Estimate</h2>
                    <div>
                        <label for="propanePct" class="form-group">Current Tank %:</label>
                        <input type="number" id="propanePct" value="80">
                    </div>
                    <div>
                        <label for="dailyBurn" class="form-group">Avg Daily Burn (gal):</label>
                        <input type="number" id="dailyBurn" value="2">
                    </div>
                    <button onclick="calculatePropane()" style="width: 100%; margin-top: 15px;">Calculate</button>
                    <div style="margin-top: 15px; display: flex; justify-content: space-around; text-align: center;">
                        <div style="width: 50%;"><label>Gallons Left</label><div id="gallonsLeft" style="font-size: 1.8rem; color: #0f172a;">400</div></div>
                        <div style="width: 50%;"><label>Days Left</label><div id="daysLeft" style="font-size: 1.8rem; color: #ea580c;">150</div></div>
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
    </html>
