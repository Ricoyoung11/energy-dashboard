<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy & Utility Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        h1 { color: #1a73e8; }
        .metric-value { font-size: 24px; font-weight: bold; color: #34a853; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Utility Analysis</h1>
        
        <div class="grid">
            <div class="card">
                <h3>Current Solar Offset</h3>
                <div id="offsetValue" class="metric-value">Calculating...</div>
                <p>Based on latest monthly entry</p>
            </div>
            <div class="card">
                <h3>Monthly Consumption</h3>
                <canvas id="usageChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Loading the data from step 1
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const latest = data[data.length - 1];
                
                // Logic: Solar Offset % = Solar Made / (Solar Made - Solar Sold + Electric Purchased)
                const selfConsumed = latest.solarMade - latest.solarSold;
                const totalUsed = selfConsumed + latest.electricPurchased;
                const offset = ((latest.solarMade / totalUsed) * 100).toFixed(1);
                
                document.getElementById('offsetValue').innerText = offset + "%";

                // Initialize Chart
                const ctx = document.getElementById('usageChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d.month),
                        datasets: [{
                            label: 'Solar Made (kWh)',
                            data: data.map(d => d.solarMade),
                            borderColor: '#fbbc05',
                            fill: false
                        }]
                    }
                });
            });
    </script>
</body>
</html>
