<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Dashboard | Mad River Road</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #cbd5e1; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .full-width { grid-column: 1 / -1; }
        .span-2 { grid-column: span 2; }
        h2 { margin-top: 0; font-size: 1.2rem; color: var(--primary); border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        h3 { font-size: 1rem; margin-bottom: 10px; color: #475569; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: #334155; }
        input, select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; transition: background 0.2s; }
        button:hover { background-color: #1d4ed8; }
        .metric { font-size: 2.5rem; font-weight: bold; text-align: center; margin: 5px 0; color: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Thornton Energy Dashboard</h1>
            <p>101 Mad River Road Management</p>
        </div>
        
        <div class="grid">
            <div class="card span-2">
                <h2>Monthly Data Entry</h2>
                <form id="energyForm">
                    <div class="form-group" style="max-width: 300px; margin-bottom: 20px;">
                        <label>Select Month to Update</label>
                        <select id="monthSelect">
                            <option value="0">January</option><option value="1">February</option>
                            <option value="2">March</option><option value="3">April</option>
                            <option value="4">May</option><option value="5">June</option>
                            <option value="6">July</option><option value="7">August</option>
                            <option value="8">September</option><option value="9">October</option>
                            <option value="10">November</option><option value="11">December</option>
                        </select>
                    </div>

                    <div class="form-grid">
                        <div>
                            <h3>Electric & Solar Raw Data</h3>
                            <div class="form-group">
                                <label>Solar Made (kWh)</label>
                                <input type="number" id="in_solarMade" placeholder="Total Generation">
                            </div>
                            <div class="form-group">
                                <label>Electric Purchased (kWh)</label>
                                <input type="number" id="in_elecPurchased" placeholder="Imported from Grid">
                            </div>
                            <div class="form-group">
                                <label>Solar Used While Making (kWh)</label>
                                <input type="number" id="in_solarUsed" placeholder="Self-Consumption">
                            </div>
                            <div class="form-group">
                                <label>Solar Sold (kWh)</label>
                                <input type="number" id="in_solarSold" placeholder="Exported to Grid">
                            </div>
                            <div class="form-group">
                                <label>kWh Paid For</label>
                                <input type="number" id="in_kwhPaid" placeholder="Billed Amount">
                            </div>
                            <div class="form-group">
                                <label>Electric Bill ($)</label>
                                <input type="number" step="0.01" id="in_elecBill" placeholder="Total Cost">
                            </div>
                        </div>

                        <div>
                            <h3>Propane Raw Data</h3>
                            <div class="form-group">
                                <label>Propane Usage (gallons)</label>
                                <input type="number" step="0.1" id="in_propaneUsage" placeholder="Gallons Burned">
                            </div>
                            <div class="form-group">
                                <label>Total Propane Cost ($)</label>
                                <input type="number" step="0.01" id="in_propaneCost" placeholder="Delivery/Bill Cost">
                            </div>
                        </div>
                    </div>
                    <button type="button" onclick="logMonthlyData()">Log Data & Calculate</button>
                </form>
            </div>

            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="card">
                    <h2>Current Offset</h2>
                    <div id="offsetText" class="metric">0%</div>
                    <p style="text-align:center; font-size: 0.8rem; color: #64748b;">Calculated Self-Sufficiency</p>
                </div>
                
                <div class="card">
                    <h2>Propane Predictor</h2>
                    <div class="form-group">
                        <label>Current Tank Level (%)</label>
                        <input type="number" id="propanePct" placeholder="e.g. 65" oninput="calculatePropane()">
                    </div>
                    <div class="form-group">
                        <label>Average Daily Burn (Gallons)</label>
                        <input type="number" step="0.1" id="dailyBurn" value="3.5" oninput="calculatePropane()">
                    </div>
                    <div style="display: flex; justify-content: space-between; text-align: center; margin-top: 15px;">
                        <div style="width: 50%;">
                            <label>Gallons Left</label>
                            <div id="gallonsLeft" class="metric" style="font-size: 1.8rem; color: #0f172a;">0</div>
                        </div>
                        <div style="width: 50%;">
                            <label>Days Left</label>
                            <div id="daysLeft" class="metric" style="font-size: 1.8rem; color: #ea580c;">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card full-width">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2 style="margin: 0; border: none;">Metric Comparison Trends</h2>
                    <select id="metricDropdown" onchange="changeChartMetric()" style="width: auto; padding: 8px 12px; font-weight: bold; font-size: 1rem;">
                        <option value="propaneUsage">Propane Usage (gallons)</option>
                        <option value="propaneCost">Total Propane Cost</option>
                        <option value="solarMade">Solar Made (kWh)</option>
                        <option value="elecPurchased">Electric Purchased</option>
                        <option value="solarUsed">Solar Used While Making (kWh)</option>
                        <option value="solarSold">Solar Sold (kWh)</option>
                        <option value="elecBill">Electric Bill</option>
                        <option value="offset" selected>Solar Offset %</option>
                        <option value="kwhPaid">kWh paid for</option>
                        <option value="totalPower">Total Power Used</option>
                    </select>
                </div>
                <canvas id="energyChart" height="80"></canvas>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
